name: Restore Playwright shard timings
description: Restores the newest timings file and pins it to this workflow run, so every shard and every re-run plans from the same bytes.
inputs:
  path:
    description: Timings file, relative to the workspace. The reporter's "timings" option is relative to the config file.
    default: shard-timings.json
  prefix:
    description: Cache key prefix. Use one per suite when a repo shards more than one.
    default: pwsb
outputs:
  found:
    description: "'true' when the pinned timings have entries. Then strict mode is on, so a shard that cannot read them fails instead of splitting the suite its own way."
    value: ${{ steps.found.outputs.found }}
runs:
  using: composite
  steps:
    # A pull request from a fork gets a read-only cache, so it cannot pin. It skips the cache and
    # writes empty timings, so every shard uses the built-in split.
    - id: pinned
      if: github.event.pull_request.head.repo.fork != true
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.prefix }}-pin-${{ github.run_id }}
    - id: latest
      if: github.event.pull_request.head.repo.fork != true && steps.pinned.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.prefix }}-timings-${{ github.run_id }}
        restore-keys: ${{ inputs.prefix }}-timings-
    # No timings yet, or a fork: write an empty file. Pinned, it makes a re-run of this workflow use the built-in split too.
    - if: steps.pinned.outputs.cache-hit != 'true' && steps.latest.outputs.cache-matched-key == ''
      shell: bash
      env:
        TIMINGS: ${{ inputs.path }}
      run: |
        mkdir -p "$(dirname "$TIMINGS")"
        printf '{"version":1,"tests":{}}\n' > "$TIMINGS"
    # Only the first shard's save succeeds; every shard then reads the pin back, so all use one copy.
    - if: github.event.pull_request.head.repo.fork != true && steps.pinned.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.prefix }}-pin-${{ github.run_id }}
    - id: confirm
      if: github.event.pull_request.head.repo.fork != true && steps.pinned.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.prefix }}-pin-${{ github.run_id }}
    # The winning shard's save may still be uploading.
    - if: github.event.pull_request.head.repo.fork != true && steps.pinned.outputs.cache-hit != 'true' && steps.confirm.outputs.cache-hit != 'true'
      shell: bash
      run: sleep 20
    - if: github.event.pull_request.head.repo.fork != true && steps.pinned.outputs.cache-hit != 'true' && steps.confirm.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.prefix }}-pin-${{ github.run_id }}
        fail-on-cache-miss: true
    - id: found
      shell: bash
      env:
        TIMINGS: ${{ inputs.path }}
      run: |
        if node -e 'const t = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); process.exit(Object.keys(t.tests ?? {}).length ? 0 : 1)' "$TIMINGS"; then
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_SHARD_BALANCER_STRICT=1" >> "$GITHUB_ENV"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
          # An earlier restore in this job, for another suite, may have turned strict mode on.
          echo "PLAYWRIGHT_SHARD_BALANCER_STRICT=0" >> "$GITHUB_ENV"
        fi
