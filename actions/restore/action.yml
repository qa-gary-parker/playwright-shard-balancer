name: Restore Playwright shard timings
description: Restores the newest timings file and pins it to this workflow run, so every shard and every re-run plans from the same bytes.
inputs:
  path:
    description: Timings file, as named in the reporter's "timings" option.
    default: shard-timings.json
  prefix:
    description: Cache key prefix. Use one per suite when a repo shards more than one.
    default: pwsb
outputs:
  found:
    description: "'true' when the pinned timings have entries. Then strict mode is on, so a shard that cannot read them fails instead of splitting the suite its own way."
    value: ${{ steps.found.outputs.found }}
runs:
  using: composite
  steps:
    - id: pinned
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.prefix }}-pin-${{ github.run_id }}
    - id: latest
      if: steps.pinned.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.prefix }}-timings-${{ github.run_id }}
        restore-keys: ${{ inputs.prefix }}-timings-
    # No timings yet: pin an empty file, so a re-run of this workflow also uses the built-in split.
    - if: steps.pinned.outputs.cache-hit != 'true' && steps.latest.outputs.cache-matched-key == ''
      shell: bash
      env:
        TIMINGS: ${{ inputs.path }}
      run: printf '{"version":1,"tests":{}}\n' > "$TIMINGS"
    # Only the first shard's save succeeds; every shard then reads the pin back, so all use one copy.
    - if: steps.pinned.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.prefix }}-pin-${{ github.run_id }}
    - id: confirm
      if: steps.pinned.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.prefix }}-pin-${{ github.run_id }}
    # The winning shard's save may still be uploading.
    - if: steps.pinned.outputs.cache-hit != 'true' && steps.confirm.outputs.cache-hit != 'true'
      shell: bash
      run: sleep 20
    - if: steps.pinned.outputs.cache-hit != 'true' && steps.confirm.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.prefix }}-pin-${{ github.run_id }}
        fail-on-cache-miss: true
    - id: found
      shell: bash
      env:
        TIMINGS: ${{ inputs.path }}
      run: |
        if node -e 'const t = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); process.exit(Object.keys(t.tests ?? {}).length ? 0 : 1)' "$TIMINGS"; then
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_SHARD_BALANCER_STRICT=1" >> "$GITHUB_ENV"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi
